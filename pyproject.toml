[project]
name = "hybrid-search-v2"
version = "0.1.0"
description = "Conversational Hybrid Search & RAG System for Catering Menus"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # LLM & RAG
    "openai>=1.12.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.5",
    "langgraph>=0.0.20",

    # Vector & Search
    "opensearch-py>=2.4.0",
    "pgvector>=0.2.4",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",

    # ORM & Migrations
    "sqlalchemy[asyncio]>=2.0.25",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",

    # Session & Cache
    "redis>=5.0.0",

    # API
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Data Processing
    "faker>=22.0.0",
    "jsonschema>=4.21.0",

    # Utilities
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "tenacity>=8.2.3",

    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",

    # Payments
    "stripe>=9.0.0",

    # Email Notifications
    "sendgrid>=6.11.0",
    # SMS Notifications
    "twilio>=8.10.0",

    # AWS Services
    "boto3>=1.34.0",

    # Graph Database
    "neo4j>=5.0.0",

    # Monitoring
    "prometheus-client>=0.20.0",
    "psutil>=5.9.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-asgi>=0.46b0",

    # Task Queue
    "celery>=5.3.0",
    "flower>=2.0.0",  # For monitoring
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
