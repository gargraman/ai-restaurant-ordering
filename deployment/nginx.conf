error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    # Use /tmp for nginx temp files (writable by non-root user)
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path        /tmp/nginx/proxy;
    fastcgi_temp_path      /tmp/nginx/fastcgi;
    uwsgi_temp_path        /tmp/nginx/uwsgi;
    scgi_temp_path         /tmp/nginx/scgi;

    # Upstream for Next.js server
    upstream nextjs_server {
        server localhost:3001;  # Next.js app runs on port 3001 inside the container
    }

    # Upstream for backend API
    upstream backend {
        server hybrid-search-api:8000;
    }

    server {
        listen 3000;

        # Serve Next.js static assets directly (immutable, content-hashed filenames)
        # Files live at /app/.next/static/ but URLs are /_next/static/ — use alias + capture
        location ~* ^/_next/static/(.*)$ {
            alias /app/.next/static/$1;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Serve other static assets; fall back to Next.js for SSR/ISR
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /app;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri @fallback;
        }

        # Named fallback: proxy unresolved static paths to Next.js
        location @fallback {
            proxy_pass http://nextjs_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy API requests to backend (strips /api/ prefix)
        location /api/ {
            proxy_pass http://backend/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Proxy direct chat/search calls to backend
        location /chat/search {
            proxy_pass http://backend/chat/search;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Proxy session endpoints to backend
        location /session/ {
            proxy_pass http://backend/session/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Proxy all other dynamic requests to Next.js
        location / {
            proxy_pass http://nextjs_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Health check endpoint (nginx-level, no upstream required)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }
    }
}
